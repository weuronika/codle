<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODLE</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .search-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            margin-bottom: 30px;
        }

        .hint-container {
            margin: 20px;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60%;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        text {
            font-size: 16px;
            color: #72a1c3;
        }

        .hint {
            width: 400px;
            height: 50px;
            border-radius: 15px;
            background-color: #20355c;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(134, 248, 108);
            font-family: 'Courier New', monospace;
            font-weight: lighter;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #result {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .row-labels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            margin-bottom: 5px;
            width: 100%;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .box-label {
            display: block;
            width: 110px;
            flex-shrink: 0;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: bold;
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px;
            flex-shrink: 0;
        }

        #dynamicList {
            padding: 0;
            margin: 0;
            list-style-type: none;
            display: flex;
            flex-direction: column;
            align-items: center; /* Trzyma rzędy wyników na środku ekranu */
            width: 100%;
        }

        #list-container {
            margin: 20px;
        }

        #new-item-input, #add-item-button {
            margin-bottom: 10px;
        }
        
        .box {
            width: 110px;
            height: 110px;
            border-radius: 11px;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            transition: background-color 0.5s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .box-success {
            background-color: #28a745;
        }

        .box-partial-arr-up {    
            background-color: #dccb35;
            /* additional arrow up */
        }

        .box-partial-arr-down {    
            background-color: #dccb35;
            /* additional arrow down */
        }

        .box-partial {    
            background-color: #dccb35;
        }

        .box-wrong {    
            background-color: #dc3545;
        }

        dialog {
            border: none;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        #welcome {
            width: 100%;
            height: 100%;
        }

        .welcome-tresc {
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="hint-container" class="hint-container"></div>

    <div class="search-container">
        <h2>Codle</h2>
        <input type="text" id="searchInput" placeholder="Type your guess...">
        <button id="searchBtn">Guess!</button>
        <div id="result"></div>
    </div>

    <button id="hintBtn">Hint!</button>
    <text id="hintTxt">Unlocks</text>
    
    <dialog id="welcome">
    <div class = "welcome-tresc"> 
        <h2>CODLE</h2>
        <button id="startBtn">START</button>
    </div>
    </dialog>
    
    <dialog id="popupVictory">
    <div class="popup-tresc">
        <h2>Correct!</h2>
        <p id="victoryAttempts"></p> 
        
        <button id="restartBtn">New Game!</button>
    </div>
    </dialog>

    
    <div id="labels" class="row-labels"></div>
    <ol id ="dynamicList"></ol>
   

    <script type="module" src="../js/main.js"></script>
</body>
</html>
